name: mmTVRemote
options:
  bundleIdPrefix: com.mmtv
  deploymentTarget:
    macOS: '15.0'
packages:
  RemoteKit:
    path: Packages/RemoteKit
settings:
  base:
    SWIFT_VERSION: '6.0'
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: '15.0'
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  mmTVRemote:
    type: application
    platform: macOS
    sources: [Apps/mmTVRemoteMac]
    dependencies:
      - package: RemoteKit
        products: [RemoteCore, RemoteRuntime]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mmtv.remote
        PRODUCT_NAME: mmTV Remote
        MARKETING_VERSION: 0.3.1
        CURRENT_PROJECT_VERSION: 4
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: mmTV Remote
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSInputMonitoringUsageDescription: 读取已配对遥控器的按键，用于控制当前 Mac 应用。
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ENABLE_APP_SANDBOX: NO
        SWIFT_STRICT_CONCURRENCY: complete
    scheme:
      gatherCoverageData: false
